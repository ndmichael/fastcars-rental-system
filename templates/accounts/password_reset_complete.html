{% extends "base.html" %}

{% load static %}
{% block title %}Password Updated | FAST CARS{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}

<section class="fc-auth-section fc-auth-section-compact">
    <div class="container">
        <div class="fc-auth-card fc-auth-card-centered text-center">

            <div class="fc-icon-box mx-auto">
                <i class="bi bi-check2-circle"></i>
            </div>

            <span class="fc-eyebrow justify-content-center">
                Password updated
            </span>

            <h1>You're all set.</h1>

            <p class="fc-text-muted">
                Your password has been changed successfully.
            </p>

            <a
                href="{% url 'accounts:login' %}"
                class="btn fc-btn fc-btn-primary mt-3"
            >
                Sign In
            </a>

        </div>
    </div>
</section>

{% endblock %}
