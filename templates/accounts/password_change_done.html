{% extends "base.html" %}

{% block title %}Password Changed | FAST CARS{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}

<section class="fc-auth-section fc-auth-section-compact">
    <div class="container">
        <div class="fc-auth-card fc-auth-card-centered text-center">

            <div class="fc-icon-box mx-auto">
                <i class="bi bi-shield-check"></i>
            </div>

            <span class="fc-eyebrow justify-content-center">
                Security updated
            </span>

            <h1>Password changed.</h1>

            <p class="fc-text-muted">
                Your account password has been updated successfully.
            </p>

            <a
                href="{% url 'pages:home' %}"
                class="btn fc-btn fc-btn-primary mt-3"
            >
                Back to FAST CARS
            </a>

        </div>
    </div>
</section>

{% endblock %}
