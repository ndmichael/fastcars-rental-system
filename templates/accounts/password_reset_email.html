<!doctype html>
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>FAST CARS Password Reset</title>
</head>

<body style="margin:0;padding:0;background:#F8F9FB;font-family:Arial,sans-serif;color:#111827;">
    <div style="max-width:600px;margin:40px auto;padding:32px;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;">
        <div style="font-size:20px;font-weight:800;color:#0B1F3A;">
            FAST<span style="font-weight:500;">CARS</span>
        </div>

        <h1 style="font-size:28px;margin:28px 0 12px;">
            Reset your password
        </h1>

        <p style="color:#6B7280;line-height:1.7;">
            We received a request to reset the password for your FAST CARS account.
        </p>

        <p style="color:#6B7280;line-height:1.7;">
            Use the button below to choose a new password.
        </p>

        <p style="margin:28px 0;">
            <a
                href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}"
                style="display:inline-block;padding:12px 20px;background:#0B1F3A;color:#FFFFFF;text-decoration:none;border-radius:8px;font-weight:700;"
            >
                Reset Password
            </a>
        </p>

        <p style="color:#6B7280;font-size:13px;line-height:1.7;">
            If you didn't request this, you can safely ignore this email.
        </p>
    </div>
</body>
</html>
