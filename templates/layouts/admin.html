{% extends "base.html" %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
{% endblock %}

{% block content %}
<div class="fc-dashboard-shell fc-admin-shell">
    {% include "components/admin_sidebar.html" %}

    <div class="fc-dashboard-main">
        {% include "components/dashboard_topbar.html" with sidebar_id="adminSidebar" %}

        <section class="fc-dashboard-content">
            <div class="container-fluid">
                {% block admin_content %}{% endblock %}
            </div>
        </section>
    </div>
</div>
{% endblock %}
