{% extends "base.html" %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'css/customer.css' %}">
{% endblock %}

{% block content %}
<div class="fc-dashboard-shell">

    {% include "components/customer_sidebar.html" %}

    <div class="fc-dashboard-main">

        {% include "components/dashboard_topbar.html" with sidebar_id="customerSidebar" %}

        <section class="fc-dashboard-content">
            <div class="container-fluid">
                {% block customer_content %}{% endblock %}
            </div>
        </section>

    </div>
</div>
{% endblock %}
