<header class="fc-dashboard-topbar">
    <div class="container-fluid">
        <div class="d-flex align-items-center justify-content-between gap-3">
            <div class="d-flex align-items-center gap-2">
                <button
                    class="btn fc-dashboard-menu d-lg-none"
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#{{ sidebar_id|default:'customerSidebar' }}"
                    aria-controls="{{ sidebar_id|default:'customerSidebar' }}"
                    aria-label="Open navigation"
                >
                    <i class="bi bi-list"></i>
                </button>

                <div>
                    <p class="fc-dashboard-eyebrow mb-0">
                        {{ portal_label|default:"Dashboard" }}
                    </p>
                    <h1 class="fc-dashboard-page-title mb-0">
                        {{ page_title|default:"Dashboard" }}
                    </h1>
                </div>
            </div>

            <div class="d-flex align-items-center gap-2">
                <button
                    class="btn fc-theme-toggle"
                    type="button"
                    data-theme-toggle
                    aria-label="Toggle dark mode"
                >
                    <i class="bi bi-moon-stars" data-theme-icon></i>
                </button>

                <div class="dropdown">
                    <button
                        class="btn fc-dashboard-user-button dropdown-toggle"
                        type="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                    >
                        {% if user.avatar %}
                            <img
                                src="{{ user.avatar.url }}"
                                alt="{{ user.get_full_name|default:user.username }}"
                                class="fc-dashboard-avatar"
                            >
                        {% else %}
                            <span class="fc-dashboard-avatar fc-dashboard-avatar-placeholder">
                                {{ user.first_name|first|default:user.username|first|upper }}
                            </span>
                        {% endif %}

                        <span class="d-none d-sm-flex flex-column text-start">
                            <strong>{{ user.get_full_name|default:user.username }}</strong>
                            <small>{{ user.role|title }}</small>
                        </span>

                        <i class="bi bi-chevron-down fc-dashboard-user-chevron"></i>
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end fc-dashboard-user-menu">
                        <li>
                            <div class="fc-dashboard-user-menu-header">
                                <strong>{{ user.get_full_name|default:user.username }}</strong>
                                <span>{{ user.email }}</span>
                            </div>
                        </li>

                        <li><hr class="dropdown-divider"></li>

                        <li>
                            <a class="dropdown-item" href="{% url 'admin:index' %}">
                                <i class="bi bi-gear"></i>
                                Django Admin
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="{% url 'accounts:password_change' %}">
                                <i class="bi bi-shield-lock"></i>
                                Change Password
                            </a>
                        </li>

                        <li><hr class="dropdown-divider"></li>

                        <li>
                            <form method="post" action="{% url 'accounts:logout' %}">
                                {% csrf_token %}
                                <button type="submit" class="dropdown-item fc-dashboard-menu-logout">
                                    <i class="bi bi-box-arrow-right"></i>
                                    Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</header>
