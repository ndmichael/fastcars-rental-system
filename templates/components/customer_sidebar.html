<aside
    class="offcanvas-lg offcanvas-start fc-dashboard-sidebar"
    tabindex="-1"
    id="customerSidebar"
    aria-labelledby="customerSidebarLabel"
>
    <div class="offcanvas-header fc-dashboard-sidebar-header">
        <a href="{% url 'pages:home' %}" class="fc-brand" aria-label="FAST CARS home">
            <span class="fc-brand-icon">
                <i class="bi bi-car-front-fill"></i>
            </span>
            FAST<span>CARS</span>
        </a>

        <button
            type="button"
            class="btn-close d-lg-none"
            data-bs-dismiss="offcanvas"
            aria-label="Close navigation"
        ></button>
    </div>

    <div class="offcanvas-body d-flex flex-column p-0">
        <div class="fc-dashboard-sidebar-label">
            Main
        </div>

        <nav class="fc-dashboard-nav">
            <a
                href="{% url 'accounts:dashboard' %}"
                class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
            >
                <i class="bi bi-grid-1x2-fill"></i>
                <span>Dashboard</span>
            </a>

            <a href="/vehicles/">
                <i class="bi bi-car-front"></i>
                <span>Browse Cars</span>
            </a>

            <a
                href="{% url 'bookings:my_bookings' %}"
                class="{% if request.resolver_match.url_name == 'my_bookings' %}active{% endif %}"
            >
                <i class="bi bi-calendar-check"></i>
                <span>My Bookings</span>
            </a>
        </nav>

        <div class="fc-dashboard-sidebar-label">
            Account
        </div>

        <nav class="fc-dashboard-nav">
            <a href="#">
                <i class="bi bi-person"></i>
                <span>Profile</span>
            </a>

            <a href="#">
                <i class="bi bi-shield-lock"></i>
                <span>Change Password</span>
            </a>
        </nav>

        <div class="mt-auto">
            <div class="fc-dashboard-sidebar-divider"></div>

            <a href="{% url 'pages:home' %}" class="fc-dashboard-nav-link">
                <i class="bi bi-arrow-left"></i>
                <span>Back to website</span>
            </a>

            <form method="post" action="{% url 'accounts:logout' %}" class="mt-1">
                {% csrf_token %}
                <button type="submit" class="fc-dashboard-nav-link fc-dashboard-logout">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Logout</span>
                </button>
            </form>
        </div>
    </div>
</aside>
